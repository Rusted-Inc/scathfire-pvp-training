name: build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Build the mod
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace

      - name: Download Carpet PvP (the bot engine) for 26.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p download
          gh release view -R AndrewCTF/Carpet-PvP --json tagName,assets -q '.tagName, (.assets[].name)' || true
          gh release download -R AndrewCTF/Carpet-PvP --pattern 'carpet-pvp-26.3*.jar' -D download || echo "Carpet PvP download failed; get it from its Modrinth page"
          rm -f download/*-sources.jar download/*paper*.jar
          ls -la download || true

      - name: Put the install folder together
        run: |
          mkdir -p install/mods
          cp build/libs/scathfire-pvp-training-*.jar install/mods/
          rm -f install/mods/*-sources.jar
          cp download/*.jar install/mods/ 2>/dev/null || true
          cp INSTALL.md install/README.md

      - name: Upload the mod files
        uses: actions/upload-artifact@v7
        with:
          name: scathfire-pvp-training
          path: install/

      - name: Publish the download on the Releases page
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd install
          zip -r ../scathfire-pvp-training.zip .
          cd ..
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"
          NOTES="Unzip and put everything in the mods folder into your .minecraft/mods folder. You also need Fabric Loader and Fabric API for Minecraft 26.3. Full steps are in README.md inside the zip."
          gh release create "$TAG" scathfire-pvp-training.zip install/mods/*.jar \
            --title "Scathfire's PvP Training ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes "$NOTES" --latest
